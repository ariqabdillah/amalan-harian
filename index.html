<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amalan Harian</title>
<meta name="description" content="Checklist amalan harian: niat sholat, dzikir pagi, dan sedekah, lengkap dengan bacaan latin dan artinya.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amalan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow">Amalan Harian</div>
      <h1 id="title">Hari Ini</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Pengaturan">⚙︎</button>
  </header>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-bacaan" hidden></section>
    <section class="view" id="view-riwayat" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Menu">
    <button class="tab on" data-view="today"><span class="ic">☑</span>Hari Ini</button>
    <button class="tab" data-view="bacaan"><span class="ic">☾</span>Bacaan</button>
    <button class="tab" data-view="riwayat"><span class="ic">▦</span>Riwayat</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/prayer.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
